# Fly.io config for the JobRadar backend (personal hosted instance).
# Deploy from this directory:  cd backend && fly launch --no-deploy  (then edit) → fly deploy
# Secrets (API keys) are NOT stored here — set them with `fly secrets set` (see DEPLOY.md).

app = "jobradar-backend"        # change to your own unique app name
primary_region = "sin"          # Singapore — close to India; pick your nearest

[build]
  dockerfile = "Dockerfile"

# Non-secret runtime config. Point storage at the mounted volume so the DB and
# uploaded resume persist across deploys/restarts.
[env]
  FLASK_ENV = "production"
  SQLITE_DB_PATH = "/data/jobradar.db"
  UPLOAD_FOLDER = "/data/uploads"

# Persistent volume (create once: `fly volumes create jobradar_data --size 1 --region sin`)
[[mounts]]
  source = "jobradar_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  # Auto-stop when idle to keep cost ~zero. NOTE: a machine can stop while a long
  # background refresh thread is still running — set min_machines_running = 1 if
  # you want refreshes to always finish (small always-on cost).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/api/health"

# 512MB: parsing ~1000 jobs + BeautifulSoup + concurrent fetches needs headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
